name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.target }} quality gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: win32-x64
          - os: ubuntu-24.04
            target: linux-x64
          - os: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python for native module builds
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Verify runner target
        run: node scripts/check-platform.js ${{ matrix.target }}

      - name: JavaScript static checks
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Compile extension
        run: npm run compile

      - name: Check native SQLite
        run: npm run check:sqlite

      - name: Test Extension Host (headless Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode

      - name: Test Extension Host (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:vscode

      - name: Build installable VSIX
        run: npm run package

      - name: Verify VSIX packaging and installed Extension Host
        if: runner.os != 'Linux'
        run: npm run test:vscode:vsix

      - name: Verify VSIX packaging and installed Extension Host (headless Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode:vsix

      - name: Upload VSIX artifact
        if: always() && hashFiles('*.vsix') != ''
        uses: actions/upload-artifact@v4
        with:
          name: headroom-quality-${{ matrix.target }}
          path: |
            *.vsix
          if-no-files-found: error
          retention-days: 14
